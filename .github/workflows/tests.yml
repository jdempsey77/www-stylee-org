name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Unit tests (site checker, fake fixtures)
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"  # no browser needed for a static check
      - name: Build static export
        run: npm run build:staging
      - name: Key pages exist and internal links resolve
        run: python scripts/check_site.py out
